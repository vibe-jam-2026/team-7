<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lunch till lunch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    /* --px is the size of one game pixel on screen; set from src/main.js */
    #stage { position: relative; --px: 4px; font-family: 'VT323', ui-monospace, monospace; color: #fff; }
    canvas#game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #stage [hidden] { display: none !important; }

    #hud { position: absolute; inset: 0; pointer-events: none; }
    #clock { position: absolute; left: calc(var(--px) * 4); top: calc(var(--px) * 4);
             font: calc(var(--px) * 5) 'Press Start 2P', monospace; text-shadow: 0 calc(var(--px) * .7) 0 #000; }
    #goal { position: absolute; left: calc(var(--px) * 4); top: calc(var(--px) * 12);
            font-size: calc(var(--px) * 8); background: rgba(10, 12, 30, .65); padding: 0 calc(var(--px) * 2);
            border-left: calc(var(--px) * 1) solid #ffb838; max-width: 60%; line-height: 1.05; }
    #timer { position: absolute; right: calc(var(--px) * 4); top: calc(var(--px) * 4);
             font: calc(var(--px) * 7) 'Press Start 2P', monospace; text-shadow: 0 calc(var(--px) * .7) 0 #000; }
    #timer.urgent { color: #ff5d5d; animation: pulse .5s infinite alternate; }
    #meter { position: absolute; right: calc(var(--px) * 4); top: calc(var(--px) * 15); width: calc(var(--px) * 70);
             height: calc(var(--px) * 7); background: rgba(10, 12, 30, .7); border: calc(var(--px) * .7) solid #fff; }
    #meter i { position: absolute; left: 0; top: 0; bottom: 0; background: #57d27a; }
    #meter.urgent i { background: #ff5d5d; }
    #meter span { position: relative; font-size: calc(var(--px) * 6.5); padding-left: calc(var(--px) * 1.5); line-height: 1; }
    @keyframes pulse { to { transform: scale(1.12); } }

    #dialog { position: absolute; left: calc(var(--px) * 6); right: calc(var(--px) * 6); bottom: calc(var(--px) * 5);
              min-height: calc(var(--px) * 30); display: flex; gap: calc(var(--px) * 4); align-items: flex-start;
              background: rgba(12, 14, 32, .93); border: calc(var(--px) * .8) solid #fff;
              padding: calc(var(--px) * 3) calc(var(--px) * 4); box-shadow: 0 0 0 calc(var(--px) * .8) #000; }
    #portrait { width: calc(var(--px) * 24); height: calc(var(--px) * 24); image-rendering: pixelated;
                background: #2a3050; border: calc(var(--px) * .6) solid #fff; flex: none; }
    #speaker { font: calc(var(--px) * 4.5) 'Press Start 2P', monospace; margin-bottom: calc(var(--px) * 1.5); }
    #line { font-size: calc(var(--px) * 9); line-height: 1; }
    #next { position: absolute; right: calc(var(--px) * 3); bottom: calc(var(--px) * 1); font-size: calc(var(--px) * 6);
            animation: pulse .4s infinite alternate; }

    #card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
            background: rgba(5, 6, 15, .88); gap: calc(var(--px) * 3); }
    #cardTop { font: calc(var(--px) * 6) 'Press Start 2P', monospace; color: #ffb838; }
    #cardTitle { font: calc(var(--px) * 11) 'Press Start 2P', monospace; line-height: 1.3; padding: 0 calc(var(--px) * 8); }
    #cardSub { font-size: calc(var(--px) * 9); color: #c8cdf0; line-height: 1.1; }
    #cardHint { font-size: calc(var(--px) * 7); color: #8890b0; animation: pulse .6s infinite alternate; }

    #shout { position: absolute; left: 0; right: 0; top: 28%; text-align: center; color: #ffe66b;
             font: calc(var(--px) * 12) 'Press Start 2P', monospace; text-shadow: 0 calc(var(--px) * 1) 0 #000; }

    .bubble { position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
              font-size: calc(var(--px) * 7); line-height: 1; color: #1b1b2a; background: #fff;
              padding: calc(var(--px) * 1) calc(var(--px) * 2); border-radius: calc(var(--px) * 2);
              box-shadow: 0 calc(var(--px) * .6) 0 #000; }
    .bubble::after { content: ''; position: absolute; left: 50%; bottom: calc(var(--px) * -1.5); margin-left: calc(var(--px) * -1.5);
                     border: calc(var(--px) * 1.5) solid transparent; border-bottom: 0; border-top-color: #fff; }
    .bubble.henrik { background: #ffb838; }
    .bubble.henrik::after { border-top-color: #ffb838; }
    .bubble.me { background: #9fd0ff; }
    .bubble.me::after { border-top-color: #9fd0ff; }
    .bubble.ux { background: #a259ff; color: #fff; }
    .bubble.ux::after { border-top-color: #a259ff; }
    /* Name tags above everyone's head (nameTags() in src/game.js) */
    .bubble.nametag { background: rgba(20, 22, 40, .85); color: #fff; border: calc(var(--px) * .4) solid rgba(255,255,255,.7);
                      font: calc(var(--px) * 3) 'Press Start 2P', monospace; padding: calc(var(--px) * .8) calc(var(--px) * 1.2);
                      border-radius: calc(var(--px) * 1); box-shadow: none; }
    .bubble.nametag::after { display: none; }
    .bubble.station { background: rgba(10, 12, 30, .8); color: #fff; font-size: calc(var(--px) * 6.5); }
    .bubble.station::after { display: none; }
    .bubble.station.next { background: #ffb838; color: #1b1b2a; }
    .bubble.station.done { background: rgba(30, 90, 50, .85); }
    .bubble.station.locked { background: rgba(40, 40, 48, .8); color: #a8a8b4; }
    .bubble.locked { background: #d63a3a; color: #fff; }
    .bubble.locked::after { border-top-color: #d63a3a; }
    /* Dialogue choices (ui.choices, used by the Kontrakt minigame) */
    #choices { position: absolute; left: calc(var(--px) * 14); right: calc(var(--px) * 14); top: calc(var(--px) * 24);
               background: rgba(12, 14, 32, .94); border: calc(var(--px) * .8) solid #fff;
               box-shadow: 0 0 0 calc(var(--px) * .8) #000; padding: calc(var(--px) * 2) calc(var(--px) * 3); }
    #choices.angry { border-color: #ff5a4a; animation: shake .12s 6; }
    #choices.calm { border-color: #57d27a; }
    #choicesWho { font: calc(var(--px) * 3.6) 'Press Start 2P', monospace; color: #ff7a6a; margin-bottom: calc(var(--px) * 1); }
    #choicesText { font-size: calc(var(--px) * 8); line-height: 1; min-height: calc(var(--px) * 8); }
    #choices.angry #choicesText { color: #ff8a7a; }
    #choices.calm #choicesText { color: #a8f0b8; }
    #choicesList { display: flex; flex-direction: column; gap: calc(var(--px) * 1); margin-top: calc(var(--px) * 2); }
    .choice { all: unset; cursor: pointer; font-family: 'VT323', monospace; font-size: calc(var(--px) * 6.5); line-height: 1.05;
              color: #dfe3f5; background: #262b4a; padding: calc(var(--px) * .6) calc(var(--px) * 2);
              border-left: calc(var(--px) * 1) solid #9fd0ff; }
    .choice b { color: #ffb838; font-weight: normal; }
    .choice:hover { background: #343b66; }
    .choice.good { background: #1f6b3a; border-color: #57d27a; color: #fff; }
    .choice.bad { background: #8e1c1c; border-color: #ff5a4a; color: #fff; }
    .choice.dim { opacity: .35; }
    .choice.hidden { visibility: hidden; }
    #choicesBar { height: calc(var(--px) * 1.5); background: rgba(255,255,255,.15); margin-top: calc(var(--px) * 2); position: relative; }
    #choicesBar i { position: absolute; left: 0; top: 0; bottom: 0; background: #ffb838; }
    #choicesBar.urgent i { background: #ff5a4a; }
    @keyframes shake { 25% { transform: translateX(calc(var(--px) * -1.5)); } 75% { transform: translateX(calc(var(--px) * 1.5)); } }
    #devmeny { position: absolute; inset: calc(var(--px) * 8) calc(var(--px) * 30); overflow-y: auto;
               background: rgba(5, 6, 15, .95); border: calc(var(--px) * .8) solid #57d27a;
               padding: calc(var(--px) * 3) calc(var(--px) * 5); font-size: calc(var(--px) * 7.5); line-height: 1.15; }
    .dev-head { font: calc(var(--px) * 5) 'Press Start 2P', monospace; color: #57d27a; margin-bottom: calc(var(--px) * 3); }
    .dev-row { white-space: pre; cursor: pointer; color: #c8cdf0; }
    .dev-row.sel { color: #1b1b2a; background: #57d27a; }
    .dev-foot { margin-top: calc(var(--px) * 3); color: #8890b0; font-size: calc(var(--px) * 6); }
    /* The button you must not press (src/knappen.js) */
    #forbidden { position: absolute; left: 50%; top: calc(var(--px) * 3); transform: translateX(-50%);
                 font: calc(var(--px) * 4) 'Press Start 2P', monospace; color: #fff; cursor: pointer;
                 background: #d42a2a; border: calc(var(--px) * .8) solid #fff; border-radius: calc(var(--px) * 3);
                 padding: calc(var(--px) * 2) calc(var(--px) * 3);
                 box-shadow: 0 calc(var(--px) * 1.2) 0 #6e0f0f, 0 0 0 calc(var(--px) * .6) #000; }
    #forbidden:hover { background: #ff3b3b; }
    #forbidden:active { transform: translateX(-50%) translateY(calc(var(--px) * 1)); box-shadow: 0 calc(var(--px) * .2) 0 #6e0f0f; }
    #card.lost { background: rgba(90, 8, 8, .93); }
    #card.lost #cardTop { color: #ff8a8a; }
    #devbtn { margin-left: 10px; font: 12px 'Press Start 2P', monospace; color: #57d27a; background: transparent;
              border: 1px solid #57d27a; padding: 3px 6px; cursor: pointer; pointer-events: auto; }
    #devbtn:hover { background: #57d27a; color: #05060f; }
    #ljudbtn { font: 13px system-ui, sans-serif; color: #c8cdf0; background: transparent; border: 1px solid #555a78;
               border-radius: 4px; padding: 2px 8px; cursor: pointer; pointer-events: auto; }
    #ljudbtn:hover { border-color: #c8cdf0; }
    #ljudbtn.blocked { color: #fff; background: #d63a3a; border-color: #d63a3a; animation: blink .6s infinite alternate; }
    @keyframes blink { to { opacity: .55; } }
    /* Power-ups in the top-right corner (src/powerups.js) */
    #powerups { position: absolute; right: calc(var(--px) * 4); top: calc(var(--px) * 25); display: grid;
                gap: calc(var(--px) * 1.2); pointer-events: none; }
    .pu { position: relative; display: flex; align-items: center; gap: calc(var(--px) * 1.5); overflow: hidden;
          background: rgba(10, 12, 30, .62); border: calc(var(--px) * .5) solid rgba(255,255,255,.18);
          padding: calc(var(--px) * .6) calc(var(--px) * 2) calc(var(--px) * .9) calc(var(--px) * 1.2);
          min-width: calc(var(--px) * 66); opacity: .72; }
    .pu-icon { font: calc(var(--px) * 6) system-ui, sans-serif; filter: grayscale(.6); }
    .pu-text { display: grid; line-height: 1; }
    .pu-text b { font-weight: normal; font-size: calc(var(--px) * 6.5); color: #fff; }
    .pu-text small { font-size: calc(var(--px) * 5); color: #a8b0d0; }
    .pu-bar { position: absolute; left: 0; bottom: 0; height: calc(var(--px) * .8); background: #ffb838; width: 0; }
    .pu.active { opacity: 1; border-color: #ffb838; background: rgba(60, 40, 5, .8); animation: blink .35s infinite alternate; }
    .pu.active .pu-icon { filter: none; }
    .pu-heard { font-size: calc(var(--px) * 5.5); color: #9fd0ff; text-align: right; max-width: calc(var(--px) * 90);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mikbtn { font: 13px system-ui, sans-serif; color: #c8cdf0; background: transparent; border: 1px solid #555a78;
              border-radius: 4px; padding: 2px 8px; cursor: pointer; pointer-events: auto; }
    #mikbtn.on { color: #05060f; background: #57d27a; border-color: #57d27a; }
    #mikbtn.bad { color: #fff; background: #d63a3a; border-color: #d63a3a; }
    #help { text-align: center; color: #8890b0;
            font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
    <div id="bubbles"></div>
    <div id="hud">
      <div id="clock"></div>
      <div id="goal" hidden></div>
      <div id="timer" hidden></div>
      <div id="meter" hidden><i></i><span></span></div>
    </div>
    <div id="shout" hidden></div>
    <div id="choices" hidden><div id="choicesWho"></div><div id="choicesText"></div><div id="choicesList"></div><div id="choicesBar"><i></i></div></div>
    <div id="dialog" hidden>
      <canvas id="portrait" width="24" height="24"></canvas>
      <div><div id="speaker"></div><div id="line"></div></div>
      <div id="next">▼</div>
    </div>
    <button id="forbidden" type="button" tabindex="-1">TRYCK INTE</button>
    <div id="card" hidden><div id="cardTop"></div><div id="cardTitle"></div><div id="cardSub"></div><div id="cardHint"></div></div>
  </div>
  <div id="help">← → gå · ↑ hoppa · mellanslag: prata / gå in · Ö: dev-meny · <button id="ljudbtn" type="button">🔊 Ljud</button> <button id="mikbtn" type="button">🎤 Röststyrning</button> <button id="devbtn" type="button">DEV</button></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
